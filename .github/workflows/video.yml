name: 免费视频识别自动执行与诊断
on:
  push:
    paths:
      - '.github/workflows/video.yml'
      - 'analyze_video.py'
      - 'generate_prompt.py'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: '公开视频 HTTPS 链接'
        required: true
        type: string
permissions:
  contents: read
  issues: write
jobs:
  analyze:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[视频反推]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装视频工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装语音识别与解析组件
        run: pip install "git+https://github.com/viking1304/yt-dlp.git@728fe46fbaa97d6f03efcaf9e766d4db63338b8d" faster-whisper "transformers>=4.56,<5" "torch>=2.4,<3" Pillow accelerate num2words torchvision
      - name: 核验抖音修复版
        run: python -c "import yt_dlp; print('yt-dlp version:',yt_dlp.version.__version__)"
      - name: 获取当前视频任务
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_URL: ${{ github.event.inputs.url }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json,subprocess
          url=os.getenv('INPUT_URL') or os.getenv('ISSUE_BODY') or ''
          issue=os.getenv('ISSUE_NUMBER','')
          if not url:
              p=subprocess.run(['gh','issue','list','--state','open','--limit','40','--json','number,title,body,createdAt'],check=True,capture_output=True,text=True)
              v=[x for x in json.loads(p.stdout) if x.get('title','').startswith('[视频反推]')]
              v.sort(key=lambda x:x['createdAt'],reverse=True)
              if not v: raise SystemExit('没有可处理的视频任务')
              url=v[0]['body'].strip()
              issue=str(v[0]['number'])
          from urllib.parse import urlparse
          import re
          m=re.search(r'https://[^\s]+',url)
          if not m: raise SystemExit('没有合法视频链接')
          url=m.group(0).rstrip('.,;')
          host=(urlparse(url).hostname or '').lower()
          domains=('douyin.com','iesdouyin.com','tiktok.com','youtube.com','youtu.be','bilibili.com','b23.tv')
          if not any(host==d or host.endswith('.'+d) for d in domains): raise SystemExit('平台不支持')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('url='+url+'\n')
              f.write('issue='+issue+'\n')
          print('本次视频',url,'回传issue',issue)
          PY
      - name: 分析视频（失败保留诊断结果）
        id: process
        continue-on-error: true
        env:
          VIDEO_URL: ${{ steps.target.outputs.url }}
        run: python analyze_video.py
      - name: 根据真实画面与声音自动生成反推提示词
        if: always()
        continue-on-error: true
        run: python generate_prompt.py
      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 视频识别结果
          path: output/
          if-no-files-found: warn
          retention-days: 1
      - name: 自动记录诊断供助手读取
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.process.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json,pathlib
          report=pathlib.Path('output/report.json')
          data=json.loads(report.read_text(encoding='utf-8')) if report.exists() else {}
          status=data.get('status','no_report')
          err=str(data.get('error',''))[:450]
          lines=[
            '自动视频识别状态：'+status,
            '工作流结果：'+os.environ['OUTCOME'],
            '运行详情：'+os.environ['RUN_URL'],
            '失败原因：'+(err or '未提供详细原因，请看运行日志'),
            '关键帧数量：'+str(len(data.get('frames',[]))),
            '完整MP4：'+('已生成（'+str(data['playback'].get('bytes'))+' bytes）' if data.get('playback') else '未生成'),
            '语音文字长度：'+str(len(data.get('transcript',''))),
            '视觉模型状态：'+str(data.get('visual_understanding',{}).get('status','not_run')),
            '视觉模型错误：'+str(data.get('visual_understanding',{}).get('error',''))[:300],
            '注意：成功提取不代表已完成 AI 视觉理解。'
          ]
          pathlib.Path('diagnostic.md').write_text('\n\n'.join(lines),encoding='utf-8')
          PY
          gh issue create --title "视频识别自动诊断 #${{ github.run_number }}" --body-file diagnostic.md || true
      - name: 自动把识别与提示词回传到请求单（供ChatGPT读取）
        if: always() && steps.target.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output/report.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          success=d.get('status')=='extracted' and bool(d.get('frames'))
          out=['## '+('视频内容提取结果' if success else '视频提取失败，未生成真实反推'),
               '处理状态：'+str(d.get('status','no_report')),
               '运行记录：'+os.environ['RUN_URL'],
               '失败原因：'+str(d.get('error','无'))[:500]]
          if success:
              out+=['### 原视频信息','完整MP4：'+('已导出 '+str(d['playback'].get('file'))+' ('+str(d['playback'].get('bytes'))+' bytes)，请从本次运行Artifact下载' if d.get('playback') else '未导出'),
                    '标题：'+str(d.get('title','未知'))[:200],
                    '时长（秒）：'+str(d.get('duration','未知')),
                    '关键帧数：'+str(len(d.get('frames',[]))),
                    '### 视频声音识别（仅语音）',
                    str(d.get('transcript','未识别到人声'))[:6000],
                    '### 画面逐帧']
              captions={x.get('frame'):x.get('description','') for x in d.get('visual_understanding',{}).get('captions',[])}
              for x in d.get('frames',[])[:10]:
                  out+=['**'+str(x.get('second'))+'秒**：'+str(captions.get(x.get('image'),'视觉模型未得到结果'))[:1000],
                        '字幕/OCR：'+str(x.get('screen_text',''))[:500]]
              prompt=pathlib.Path('output/视频反推提示词.md')
              if prompt.exists():
                  out+=['### 制作提示词与反推指令',prompt.read_text(encoding='utf-8')[:10000]]
              else:
                  out+=['尚未生成反推文本，请查看运行记录']
          pathlib.Path('issue-result.md').write_text('\n\n'.join(out),encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file issue-result.md
      - name: 标记真正的失败
        if: steps.process.outcome != 'success'
        run: exit 1
